<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e2f5b" stroke-width="1.5" />
  <!-- Golden circular border -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#goldGlow)" />
  <!-- Headset band -->
  <path d="M 20 32 A 12 12 0 0 1 44 32" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Ear cups -->
  <rect x="17" y="30" width="6" height="11" rx="3" fill="#fbbf24" />
  <rect x="41" y="30" width="6" height="11" rx="3" fill="#fbbf24" />
  <!-- Audio wave bars in center -->
  <line x1="28" y1="36" x2="28" y2="28" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="40" x2="32" y2="24" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="36" y1="37" x2="36" y2="27" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
  <!-- Microphone boom -->
  <path d="M 20 38 Q 23 46 30 46" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  <circle cx="31" cy="46" r="2.5" fill="#fbbf24" />
</svg>
