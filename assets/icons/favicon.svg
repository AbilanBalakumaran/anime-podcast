<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="64" height="64">
  <defs>
    <!-- Metallic Gold Lighter Body Gradient -->
    <linearGradient id="favLighterGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="15%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Lid Gradient (Angled) -->
    <linearGradient id="favLidGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Chimney / Burner Gradient -->
    <linearGradient id="favChimneyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="favFlameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="favFlameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="favFlameGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- FLAME -->
  <g filter="url(#favFlameGlow)">
    <path d="M 103 81 C 95 79, 87 69, 88 57 C 89 45, 98 35, 101 23 C 107 35, 119 47, 117 61 C 116 71, 110 79, 103 81 Z" fill="url(#favFlameOuter)" />
    <path d="M 103 79 C 97 77, 92 69, 93 59 C 94 49, 100 41, 102 31 C 106 41, 113 49, 112 61 C 111 70, 107 77, 103 79 Z" fill="url(#favFlameCore)" />
    <path d="M 103 77 C 99 76, 96 71, 97 63 C 98 55, 102 49, 103 41 C 105 49, 108 55, 108 63 C 108 71, 106 76, 103 77 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="105" cy="19" r="1.5" fill="#fef08a" />
    <circle cx="112" cy="27" r="1.2" fill="#f97316" />
    <circle cx="94" cy="30" r="1" fill="#facc15" />
  </g>

  <!-- CHIMNEY / BURNER -->
  <g>
    <rect x="90" y="79" width="26" height="24" rx="2" fill="url(#favChimneyGrad)" stroke="#ca8a04" stroke-width="1.2" />
    <circle cx="95" cy="85" r="1.8" fill="#18181c" />
    <circle cx="103" cy="85" r="1.8" fill="#18181c" />
    <circle cx="111" cy="85" r="1.8" fill="#18181c" />
    <circle cx="95" cy="93" r="1.8" fill="#18181c" />
    <circle cx="103" cy="93" r="1.8" fill="#18181c" />
    <circle cx="111" cy="93" r="1.8" fill="#18181c" />
    <rect x="116" y="85" width="6" height="15" rx="1.5" fill="#d4d4d8" stroke="#71717a" stroke-width="1" />
  </g>

  <!-- OPEN LID -->
  <g>
    <circle cx="75" cy="103" r="3.5" fill="#ca8a04" stroke="#78350f" stroke-width="1" />
    <circle cx="75" cy="103" r="1.5" fill="#fef08a" />
    <polygon points="75,102 59,61 76,55 92,96" fill="url(#favLidGold)" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="74,100 63,64 74,60 85,96" fill="#27272a" opacity="0.85" />
    <line x1="59" y1="61" x2="76" y2="55" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MAIN LIGHTER BODY -->
  <g>
    <rect x="75" y="102" width="56" height="66" rx="4" fill="url(#favLighterGold)" stroke="#ca8a04" stroke-width="1.8" />
    <path d="M 77 166 L 77 104 L 129 104" fill="none" stroke="#fef9c3" stroke-width="1.6" stroke-linecap="round" />
    <line x1="130" y1="104" x2="130" y2="166" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" />
    <line x1="89" y1="113" x2="89" y2="160" stroke="#ca8a04" stroke-width="1.2" />
    <line x1="91" y1="113" x2="91" y2="160" stroke="#fef08a" stroke-width="1.2" />
    <g transform="translate(105, 136) scale(0.65)">
      <path d="M -12 0 C -12 -8, -4 -12, 4 -12 C 12 -12, 16 -6, 16 2 C 16 10, 8 14, 0 14 C -6 14, -10 10, -10 4 C -10 -2, -6 -6, 0 -6 C 4 -6, 6 -3, 6 0" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
      <path d="M -12 0 C -12 -8, -4 -12, 4 -12 C 12 -12, 16 -6, 16 2 C 16 10, 8 14, 0 14 C -6 14, -10 10, -10 4 C -10 -2, -6 -6, 0 -6 C 4 -6, 6 -3, 6 0" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" />
    </g>
    <line x1="78" y1="167" x2="128" y2="167" stroke="#b45309" stroke-width="1.4" />
  </g>
</svg>
