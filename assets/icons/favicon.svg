<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Flame Aura -->
    <radialGradient id="flameAura64" cx="54%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Body -->
    <linearGradient id="goldBody64" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="20%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameOuter64" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="flameCore64" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="flameGlow64" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad64)" stroke="#27272a" stroke-width="1.2" />

  <!-- Ambient Glow -->
  <rect width="64" height="64" rx="14" fill="url(#flameAura64)" />

  <!-- Outer Cyber Gold Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#facc15" stroke-width="0.8" opacity="0.35" stroke-dasharray="2 3" />

  <!-- ======================================================================
       SANJI'S OPEN LIGHTER (64x64 Optimized)
       ====================================================================== -->

  <!-- FLAME -->
  <g filter="url(#flameGlow64)">
    <!-- Outer Flame -->
    <path d="M 35 25 C 32 24, 29 20, 29 16 C 30 12, 33 9, 34 5 C 36 9, 41 13, 40 18 C 39 21, 37 24, 35 25 Z" fill="url(#flameOuter64)" />
    <!-- Inner Core Flame -->
    <path d="M 35 24 C 33 23, 31 20, 31 17 C 32 14, 34 11, 34 8 C 36 11, 38 14, 38 18 C 37 21, 36 23, 35 24 Z" fill="url(#flameCore64)" />
    <!-- Hot Spark -->
    <circle cx="35" cy="4" r="0.8" fill="#ffffff" />
  </g>

  <!-- CHIMNEY / BURNER -->
  <rect x="30" y="24" width="10" height="9" rx="1" fill="#a1a1aa" stroke="#ca8a04" stroke-width="0.8" />
  <!-- Chimney Holes -->
  <circle cx="33" cy="27" r="0.8" fill="#18181c" />
  <circle cx="37" cy="27" r="0.8" fill="#18181c" />
  <circle cx="33" cy="30" r="0.8" fill="#18181c" />
  <circle cx="37" cy="30" r="0.8" fill="#18181c" />
  <!-- Flint Wheel -->
  <rect x="40" y="27" width="2.5" height="5.5" rx="0.5" fill="#e4e4e7" stroke="#71717a" stroke-width="0.6" />

  <!-- OPEN LID (Flipped back left) -->
  <circle cx="24.5" cy="33" r="1.5" fill="#ca8a04" stroke="#78350f" stroke-width="0.5" />
  <polygon points="24,32 11,24 15,18 28,26" fill="url(#goldBody64)" stroke="#ca8a04" stroke-width="0.8" stroke-linejoin="round" />
  <polygon points="23,31 12,24 14,20 26,27" fill="#27272a" opacity="0.85" />
  <line x1="15" y1="18" x2="28" y2="26" stroke="#fef08a" stroke-width="0.8" stroke-linecap="round" />

  <!-- LIGHTER BODY -->
  <rect x="24" y="32.5" width="20" height="23" rx="2" fill="url(#goldBody64)" stroke="#ca8a04" stroke-width="1" />
  <!-- Highlights -->
  <path d="M 25 54 L 25 33.5 L 43 33.5" fill="none" stroke="#fef9c3" stroke-width="0.8" stroke-linecap="round" />
  <line x1="43" y1="34" x2="43" y2="54" stroke="#78350f" stroke-width="0.9" stroke-linecap="round" />
  <!-- Engraved detail -->
  <line x1="29" y1="36" x2="29" y2="52" stroke="#ca8a04" stroke-width="0.7" />
  <line x1="30" y1="36" x2="30" y2="52" stroke="#fef08a" stroke-width="0.7" />
  <!-- Spiral Dot Emblem -->
  <circle cx="36" cy="44" r="2.5" fill="none" stroke="#78350f" stroke-width="1" />
  <circle cx="36" cy="44" r="1.5" fill="#fef08a" />
</svg>
