<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Noir Obsidienne) -->
    <linearGradient id="bgGrad64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Cyber Gold Gradients -->
    <linearGradient id="goldGrad64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="goldHair64" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="80%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad64)" stroke="#27272a" stroke-width="1.2" />

  <!-- Cyber Gold Outer Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#goldGrad64)" stroke-width="1.5" opacity="0.85" />
  <circle cx="32" cy="32" r="23" fill="#0d0d11" />

  <!-- Suit & Neck -->
  <path d="M 15 60 L 21 47 L 27 50 L 32 54 L 37 50 L 43 47 L 49 60 Z" fill="#18181c" stroke="#27272a" stroke-width="0.8" />
  <polygon points="28,48 32,53 36,48 32,46" fill="#ffffff" />
  <polygon points="31,49 33,49 33,58 32,59 31,58" fill="#09090b" stroke="#facc15" stroke-width="0.5" />

  <!-- Face Base -->
  <path d="M 23 32 Q 24 44 32 46 Q 40 44 41 32 Z" fill="#141418" stroke="#3f3f46" stroke-width="0.8" />

  <!-- Cigarette with Ember and Smoke -->
  <line x1="31" y1="42" x2="19" y2="45" stroke="#f4f4f5" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="18" cy="45.3" r="1.2" fill="#f97316" />
  <circle cx="18" cy="45.3" r="0.7" fill="#fef08a" />
  <!-- Smoke swirl -->
  <path d="M 17.5 44 C 15 41, 14 37, 17 34 C 20 30, 18 26, 16 23" fill="none" stroke="url(#goldGrad64)" stroke-width="1" stroke-linecap="round" opacity="0.7" />

  <!-- Sanji Visible Eye (Right) -->
  <path d="M 34 32.5 Q 37 31 40 33" fill="none" stroke="#facc15" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="37" cy="33.5" r="1.3" fill="#facc15" />
  <circle cx="37" cy="33.5" r="0.6" fill="#09090b" />

  <!-- Sanji Curled Eyebrow (Spiral at tip) -->
  <path d="M 33 30 Q 37 28.5 40 29.5" fill="none" stroke="#facc15" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 40 29.5 C 41.5 30, 42 28.8, 41.2 27.8 C 40.2 27, 39 28.2, 40 29" fill="none" stroke="#facc15" stroke-width="1.1" stroke-linecap="round" />

  <!-- Sanji Blond Hair Sweep -->
  <!-- Base mass -->
  <path d="M 21 32 C 19 23, 24 14, 32 14 C 41 14, 45 22, 44 32 C 43 38, 40 43, 39 44 C 37 38, 37 35, 36 32 C 34 29, 30 26, 27 27 C 23 28, 20 34, 21 32 Z" fill="url(#goldHair64)" />

  <!-- Main Diagonal Sweep covering left eye -->
  <path d="M 32 14 Q 26 22 24 33 Q 22 41 25 45 Q 21 38 23 30 Q 25 22 32 14 Z" fill="#fde047" />
  <path d="M 35 16 Q 30 25 28 36 Q 27 42 30 46 Q 26 40 27 33 Q 29 24 35 16 Z" fill="#facc15" />
  <!-- Hair sheen -->
  <path d="M 33 15 Q 28 24 27 31 C 28 25, 31 19, 33 15 Z" fill="#fef9c3" opacity="0.9" />

  <!-- Accent dot -->
  <circle cx="49" cy="49" r="1.2" fill="#facc15" opacity="0.8" />
</svg>
