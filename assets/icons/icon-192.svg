<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)" stroke="#1e2f5b" stroke-width="3" />
  <!-- Golden circular frame -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="url(#goldGrad192)" stroke-width="5" filter="url(#goldGlow192)" />
  <!-- Headset headband -->
  <path d="M 60 96 A 36 36 0 0 1 132 96" fill="none" stroke="url(#goldGrad192)" stroke-width="8" stroke-linecap="round" />
  <!-- Ear cups -->
  <rect x="52" y="90" width="16" height="32" rx="8" fill="#fbbf24" />
  <rect x="124" y="90" width="16" height="32" rx="8" fill="#fbbf24" />
  <!-- Audio spectrum waves -->
  <line x1="82" y1="108" x2="82" y2="84" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" />
  <line x1="96" y1="120" x2="96" y2="72" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" />
  <line x1="110" y1="112" x2="110" y2="80" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" />
  <!-- Microphone boom -->
  <path d="M 60 112 Q 68 136 90 136" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <circle cx="92" cy="136" r="7" fill="#fbbf24" />
  <!-- Decorative stars / sparkle -->
  <path d="M 136 54 L 140 64 L 150 68 L 140 72 L 136 82 L 132 72 L 122 68 L 132 64 Z" fill="#fbbf24" opacity="0.85" />
</svg>
