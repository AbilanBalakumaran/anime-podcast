<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Metallic Gold Lighter Body Gradient -->
    <linearGradient id="lighterGold192" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="15%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Lid Gradient (Angled) -->
    <linearGradient id="lidGold192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Chimney / Burner Gradient -->
    <linearGradient id="chimneyGrad192" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameOuter192" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="flameCore192" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="flameGlow192" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ======================================================================
       SANJI'S OPEN LIGHTER (Optical and Mathematical Center at X=96)
       ====================================================================== -->

  <!-- FLAME (Centered at X=96, Rising from the Chimney) -->
  <g filter="url(#flameGlow192)">
    <!-- Outer Flame Body -->
    <path d="M 96 81 C 88 79, 80 69, 81 57 C 82 45, 91 35, 94 23 C 100 35, 112 47, 110 61 C 109 71, 103 79, 96 81 Z" fill="url(#flameOuter192)" />

    <!-- Inner Hot Flame Body -->
    <path d="M 96 79 C 90 77, 85 69, 86 59 C 87 49, 93 41, 95 31 C 99 41, 106 49, 105 61 C 104 70, 100 77, 96 79 Z" fill="url(#flameCore192)" />

    <!-- Pure White-Hot Core Teardrop -->
    <path d="M 96 77 C 92 76, 89 71, 90 63 C 91 55, 95 49, 96 41 C 98 49, 101 55, 101 63 C 101 71, 99 76, 96 77 Z" fill="#ffffff" opacity="0.95" />

    <!-- Embers / Sparks -->
    <circle cx="98" cy="19" r="1.5" fill="#fef08a" />
    <circle cx="105" cy="27" r="1.2" fill="#f97316" />
    <circle cx="87" cy="30" r="1" fill="#facc15" />
  </g>

  <!-- CHIMNEY / BURNER (Centered at X=96) -->
  <g id="chimney">
    <!-- Chimney Body -->
    <rect x="83" y="79" width="26" height="24" rx="2" fill="url(#chimneyGrad192)" stroke="#ca8a04" stroke-width="1.2" />
    <!-- Chimney Ventilation Holes -->
    <circle cx="88" cy="85" r="1.8" fill="#18181c" />
    <circle cx="96" cy="85" r="1.8" fill="#18181c" />
    <circle cx="104" cy="85" r="1.8" fill="#18181c" />
    <circle cx="88" cy="93" r="1.8" fill="#18181c" />
    <circle cx="96" cy="93" r="1.8" fill="#18181c" />
    <circle cx="104" cy="93" r="1.8" fill="#18181c" />

    <!-- Flint Striker Wheel on Right -->
    <rect x="109" y="85" width="6" height="15" rx="1.5" fill="#d4d4d8" stroke="#71717a" stroke-width="1" />
    <line x1="109" y1="89" x2="115" y2="89" stroke="#52525b" stroke-width="0.8" />
    <line x1="109" y1="92" x2="115" y2="92" stroke="#52525b" stroke-width="0.8" />
    <line x1="109" y1="95" x2="115" y2="95" stroke="#52525b" stroke-width="0.8" />
  </g>

  <!-- OPEN LID (Flipped back on hinge at X=68) -->
  <g id="open-lid">
    <!-- Hinge Pin -->
    <circle cx="68" cy="103" r="3.5" fill="#ca8a04" stroke="#78350f" stroke-width="1" />
    <circle cx="68" cy="103" r="1.5" fill="#fef08a" />

    <!-- Angled Open Lid Shell -->
    <polygon points="68,102 52,61 69,55 85,96" fill="url(#lidGold192)" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Lid Interior Hollow (Dark Shadow) -->
    <polygon points="67,100 56,64 67,60 78,96" fill="#27272a" opacity="0.85" />
    <!-- Highlight edge on lid lip -->
    <line x1="52" y1="61" x2="69" y2="55" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MAIN LIGHTER BODY (Solid Gold Casing, Centered at X=96) -->
  <g id="lighter-body">
    <!-- Main Box -->
    <rect x="68" y="102" width="56" height="66" rx="4" fill="url(#lighterGold192)" stroke="#ca8a04" stroke-width="1.8" />

    <!-- Beveled Edge Highlight (Top & Left) -->
    <path d="M 70 166 L 70 104 L 122 104" fill="none" stroke="#fef9c3" stroke-width="1.6" stroke-linecap="round" />

    <!-- Dark Shadow on Right Edge -->
    <line x1="123" y1="104" x2="123" y2="166" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" />

    <!-- Elegant Sanji Vertical Engraved Stripe Detail -->
    <line x1="82" y1="113" x2="82" y2="160" stroke="#ca8a04" stroke-width="1.2" />
    <line x1="84" y1="113" x2="84" y2="160" stroke="#fef08a" stroke-width="1.2" />

    <!-- Sanji's Signature Spiral Eyebrow Emblem Engraved on the Lighter Face -->
    <g transform="translate(98, 136) scale(0.65)">
      <path d="M -12 0 C -12 -8, -4 -12, 4 -12 C 12 -12, 16 -6, 16 2 C 16 10, 8 14, 0 14 C -6 14, -10 10, -10 4 C -10 -2, -6 -6, 0 -6 C 4 -6, 6 -3, 6 0" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
      <path d="M -12 0 C -12 -8, -4 -12, 4 -12 C 12 -12, 16 -6, 16 2 C 16 10, 8 14, 0 14 C -6 14, -10 10, -10 4 C -10 -2, -6 -6, 0 -6 C 4 -6, 6 -3, 6 0" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Bottom edge reflection -->
    <line x1="71" y1="167" x2="121" y2="167" stroke="#b45309" stroke-width="1.4" />
  </g>
</svg>
