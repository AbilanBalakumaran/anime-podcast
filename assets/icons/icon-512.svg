<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Noir Obsidienne) -->
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Cyber Gold Gradients -->
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="goldHairGrad512" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="suitGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="goldGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="emberGlow512" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#27272a" stroke-width="4" />

  <!-- Cyber Gold Outer Ring -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad512)" stroke-width="8" opacity="0.85" filter="url(#goldGlow512)" />
  <circle cx="256" cy="256" r="186" fill="#0d0d11" opacity="0.9" />

  <!-- Decorative tech arcs -->
  <path d="M 106 256 A 150 150 0 0 1 406 256" fill="none" stroke="#27272a" stroke-width="3" stroke-dasharray="10 14" />

  <!-- ======================================================================
       SANJI SILHOUETTE & FEATURES (High-Res 512)
       ====================================================================== -->

  <!-- Suit & Shoulders -->
  <path d="M 117 480 L 165 378 L 218 405 L 256 432 L 293 405 L 346 378 L 394 480 Z" fill="url(#suitGrad512)" stroke="#27272a" stroke-width="4" />
  
  <!-- Shirt & Tie -->
  <polygon points="229,384 256,421 283,384 256,373" fill="#ffffff" />
  <polygon points="250,389 261,389 264,464 256,474 248,464" fill="#09090b" stroke="#facc15" stroke-width="2" />
  
  <!-- Suit Collar / Lapels with Gold Edges -->
  <path d="M 170 378 L 224 410 L 208 474" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
  <path d="M 341 378 L 288 410 L 304 474" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" />

  <!-- Neck & Face -->
  <path d="M 226 309 L 226 386 L 285 386 L 285 309 Z" fill="#fcd34d" opacity="0.3" />
  <!-- Jawline -->
  <path d="M 181 256 Q 192 352 256 368 Q 320 352 330 256 Z" fill="#141418" stroke="#3f3f46" stroke-width="3" />

  <!-- Cigarette in mouth -->
  <line x1="245" y1="336" x2="160" y2="360" stroke="#f4f4f5" stroke-width="8" stroke-linecap="round" />
  <!-- Burning ember at tip with glow -->
  <circle cx="154" cy="361" r="6.5" fill="#f97316" filter="url(#emberGlow512)" />
  <circle cx="154" cy="361" r="4" fill="#fef08a" />
  <!-- Rising smoke trail in stylized cyber gold curve -->
  <path d="M 152 354 C 133 333, 128 304, 146 280 C 168 250, 154 224, 138 197" fill="none" stroke="url(#goldGrad512)" stroke-width="4.8" stroke-linecap="round" opacity="0.65" />

  <!-- Sanji Visible Eye (Right side) -->
  <path d="M 274 261 Q 298 250 317 264" fill="none" stroke="#facc15" stroke-width="5.8" stroke-linecap="round" />
  <ellipse cx="296" cy="269" rx="9" ry="12" fill="#facc15" />
  <circle cx="296" cy="269" r="5" fill="#09090b" />
  <circle cx="300" cy="265" r="2.5" fill="#ffffff" />
  <path d="M 282 282 Q 298 288 314 282" fill="none" stroke="#ca8a04" stroke-width="3.2" stroke-linecap="round" />

  <!-- The Signature Sanji Spiral Eyebrow (curled swirl at the tip) -->
  <path d="M 269 242 Q 293 232 314 240" fill="none" stroke="#facc15" stroke-width="6.4" stroke-linecap="round" />
  <!-- Spiral curl at outer tip -->
  <path d="M 314 240 C 325 242, 330 234, 325 226 C 317 221, 309 229, 314 234" fill="none" stroke="#facc15" stroke-width="5.8" stroke-linecap="round" />

  <!-- ======================================================================
       SANJI SLEEK BLOND HAIR
       Signature long dynamic fringe sweeping down over the left side of face
       ====================================================================== -->
  <!-- Hair Base Volume -->
  <path d="M 170 256 C 154 186, 192 112, 256 112 C 330 112, 362 181, 352 256 C 346 304, 325 341, 320 352 C 304 309, 298 288, 293 261 C 277 234, 245 208, 218 218 C 186 229, 165 277, 170 256 Z" fill="url(#goldHairGrad512)" />

  <!-- Sweeping Bangs covering the left eye -->
  <!-- Strand 1: Main dramatic diagonal sweep across face -->
  <path d="M 256 112 Q 208 173 192 266 Q 181 325 197 362 Q 176 309 186 245 Q 202 181 256 112 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2" />

  <!-- Strand 2: Central stylized lock covering left eye entirely -->
  <path d="M 282 128 Q 240 197 224 288 Q 213 336 234 368 Q 208 320 218 261 Q 234 192 282 128 Z" fill="#facc15" />

  <!-- Strand 3: High-sheen hair highlight lock -->
  <path d="M 261 117 Q 226 186 218 245 C 224 200, 245 154, 261 117 Z" fill="#fef9c3" opacity="0.9" />

  <!-- Strand 4: Right side bangs framing face & eye -->
  <path d="M 298 138 Q 330 192 336 250 Q 320 224 309 202 Q 293 173 298 138 Z" fill="#eab308" />
  <path d="M 325 176 Q 357 224 352 282 Q 341 245 330 218 Z" fill="#ca8a04" />

  <!-- Crown hair spike details -->
  <path d="M 208 144 Q 181 122 165 149 Q 186 149 208 144 Z" fill="#facc15" />
  <path d="M 245 117 Q 234 90 218 106 Q 229 117 245 117 Z" fill="#fde047" />
  <path d="M 277 114 Q 298 88 314 112 Q 293 112 277 114 Z" fill="#fde047" />

  <!-- Ambient Cyber Accent: Soundwave / Audio Bar dots at bottom corner -->
  <circle cx="394" cy="394" r="8" fill="#facc15" opacity="0.8" />
  <circle cx="416" cy="384" r="5" fill="#facc15" opacity="0.5" />
</svg>
