<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Gold Lighter Body Gradient -->
    <linearGradient id="lighterGold512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="15%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Lid Gradient (Angled) -->
    <linearGradient id="lidGold512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Chimney / Burner Gradient -->
    <linearGradient id="chimneyGrad512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameOuter512" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="flameCore512" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="flameGlow512" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ======================================================================
       SANJI'S OPEN LIGHTER (Perfect Centering in 512x512 ViewBox)
       ====================================================================== -->

  <!-- FLAME (Rising from the Chimney) -->
  <g filter="url(#flameGlow512)">
    <!-- Outer Flame Body -->
    <path d="M 275 216 C 254 210, 233 184, 235 152 C 238 120, 262 93, 270 61 C 286 93, 318 125, 313 162 C 310 189, 294 210, 275 216 Z" fill="url(#flameOuter512)" />

    <!-- Inner Hot Flame Body -->
    <path d="M 275 210 C 259 205, 246 184, 249 157 C 251 130, 267 109, 273 82 C 283 109, 302 130, 299 162 C 297 186, 286 205, 275 210 Z" fill="url(#flameCore512)" />

    <!-- Pure White-Hot Core Teardrop -->
    <path d="M 275 205 C 265 202, 257 189, 259 168 C 262 146, 273 130, 275 109 C 281 130, 289 146, 289 168 C 289 189, 283 202, 275 205 Z" fill="#ffffff" opacity="0.95" />

    <!-- Embers / Sparks -->
    <circle cx="281" cy="50" r="4" fill="#fef08a" />
    <circle cx="299" cy="72" r="3" fill="#f97316" />
    <circle cx="251" cy="80" r="2.5" fill="#facc15" />
  </g>

  <!-- CHIMNEY / BURNER -->
  <g id="chimney512">
    <!-- Chimney Body -->
    <rect x="240" y="210" width="69" height="64" rx="5" fill="url(#chimneyGrad512)" stroke="#ca8a04" stroke-width="3" />
    <!-- Chimney Ventilation Holes -->
    <circle cx="253" cy="226" r="4.5" fill="#18181c" />
    <circle cx="274" cy="226" r="4.5" fill="#18181c" />
    <circle cx="296" cy="226" r="4.5" fill="#18181c" />
    <circle cx="253" cy="248" r="4.5" fill="#18181c" />
    <circle cx="274" cy="248" r="4.5" fill="#18181c" />
    <circle cx="296" cy="248" r="4.5" fill="#18181c" />

    <!-- Flint Striker Wheel on Right -->
    <rect x="309" y="226" width="16" height="40" rx="4" fill="#d4d4d8" stroke="#71717a" stroke-width="2.5" />
    <line x1="309" y1="237" x2="325" y2="237" stroke="#52525b" stroke-width="2" />
    <line x1="309" y1="245" x2="325" y2="245" stroke="#52525b" stroke-width="2" />
    <line x1="309" y1="253" x2="325" y2="253" stroke="#52525b" stroke-width="2" />
  </g>

  <!-- OPEN LID (Flipped back ~75 degrees) -->
  <g id="open-lid512">
    <!-- Hinge Pin -->
    <circle cx="200" cy="274" r="9" fill="#ca8a04" stroke="#78350f" stroke-width="2.5" />
    <circle cx="200" cy="274" r="4" fill="#fef08a" />

    <!-- Angled Open Lid Shell -->
    <polygon points="200,272 157,163 203,147 245,256" fill="url(#lidGold512)" stroke="#ca8a04" stroke-width="4" stroke-linejoin="round" />
    <!-- Lid Interior Shadow -->
    <polygon points="197,267 168,171 197,160 227,256" fill="#27272a" opacity="0.85" />
    <!-- Highlight edge on lid lip -->
    <line x1="157" y1="163" x2="203" y2="147" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- MAIN LIGHTER BODY (Solid Gold Casing) -->
  <g id="lighter-body512">
    <!-- Main Box -->
    <rect x="200" y="272" width="149" height="176" rx="10" fill="url(#lighterGold512)" stroke="#ca8a04" stroke-width="4.5" />

    <!-- Beveled Edge Highlight -->
    <path d="M 205 442 L 205 277 L 344 277" fill="none" stroke="#fef9c3" stroke-width="4" stroke-linecap="round" />

    <!-- Dark Shadow on Right Edge -->
    <line x1="347" y1="277" x2="347" y2="442" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" />

    <!-- Elegant Sanji Vertical Engraved Stripe Detail -->
    <line x1="237" y1="301" x2="237" y2="426" stroke="#ca8a04" stroke-width="3" />
    <line x1="242" y1="301" x2="242" y2="426" stroke="#fef08a" stroke-width="3" />

    <!-- Sanji's Signature Spiral Eyebrow Emblem Engraved on the Lighter Face -->
    <g transform="translate(280, 362) scale(1.6)">
      <path d="M -12 0 C -12 -8, -4 -12, 4 -12 C 12 -12, 16 -6, 16 2 C 16 10, 8 14, 0 14 C -6 14, -10 10, -10 4 C -10 -2, -6 -6, 0 -6 C 4 -6, 6 -3, 6 0" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
      <path d="M -12 0 C -12 -8, -4 -12, 4 -12 C 12 -12, 16 -6, 16 2 C 16 10, 8 14, 0 14 C -6 14, -10 10, -10 4 C -10 -2, -6 -6, 0 -6 C 4 -6, 6 -3, 6 0" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Bottom edge reflection -->
    <line x1="208" y1="445" x2="342" y2="445" stroke="#b45309" stroke-width="3.5" />
  </g>
</svg>
